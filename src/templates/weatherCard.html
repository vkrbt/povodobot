<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8" />
<title>Sunset Card</title>
<style>
  :root {
    --w: {{WIDTH}}px;
    --h: {{HEIGHT}}px;
    --ink: #1a1530;
    --ink-soft: #4a3f6b;
    --paper: #fff6ec;
    --line: rgba(26, 21, 48, 0.12);
    --tile-bg: rgba(255, 255, 255, 0.55);
    --wish-bg: rgba(26, 21, 48, 0.78);
    --wish-color: #fff5e6;
    --bg1: #ffe8d4;
    --bg2: #ffd1b3;
    --bg3: #f6b690;
    --glow-a: rgba(255, 220, 170, 0.55);
    --glow-b: rgba(255, 107, 61, 0.35);
    --sun-grad: radial-gradient(circle, #ffd27a 0%, #ffb05a 55%, rgba(255,176,90,0) 70%);
    --horizon-grad: linear-gradient(180deg, rgba(255, 107, 61, 0) 0%, rgba(202, 75, 50, 0.18) 60%, rgba(82, 32, 60, 0.28) 100%);
    /* Цвет цифр заката: как у ветра/ощущается, но с оранжевым подтоном.
       Тёмный — на светлых темах, светлый — на тёмных. Контраст всегда сохраняется. */
    --sunset-ink: #3b1f0c;
    --temp-grad: linear-gradient(180deg, #ff7a3a 0%, #c63d4c 100%);
  }

  /* === Weather themes === */
  body.wx-clear {
    --bg1: #ffe8d4;
    --bg2: #ffd1b3;
    --bg3: #f6b690;
    --glow-a: rgba(255, 220, 170, 0.55);
    --glow-b: rgba(255, 107, 61, 0.35);
    --sun-grad: radial-gradient(circle, #ffd27a 0%, #ffb05a 55%, rgba(255,176,90,0) 70%);
    --horizon-grad: linear-gradient(180deg, rgba(255, 107, 61, 0) 0%, rgba(202, 75, 50, 0.18) 60%, rgba(82, 32, 60, 0.28) 100%);
  }
  body.wx-cloudy {
    --bg1: #e8e8ee;
    --bg2: #c9cdd6;
    --bg3: #a1a8b6;
    --glow-a: rgba(255, 230, 200, 0.4);
    --glow-b: rgba(70, 90, 130, 0.25);
    --sun-grad: radial-gradient(circle, rgba(255, 235, 200, 0.45) 0%, rgba(255, 235, 200, 0) 70%);
    --horizon-grad: linear-gradient(180deg, transparent 0%, rgba(40, 60, 100, 0.15) 60%, rgba(20, 30, 50, 0.3) 100%);
  }
  body.wx-fog {
    --bg1: #e6e6ec;
    --bg2: #c9c8d1;
    --bg3: #a4a3ae;
    --glow-a: rgba(255, 255, 255, 0.55);
    --glow-b: rgba(180, 180, 200, 0.3);
    --sun-grad: radial-gradient(circle, rgba(255, 255, 255, 0.55) 0%, rgba(255,255,255,0) 70%);
    --horizon-grad: linear-gradient(180deg, transparent 0%, rgba(120, 120, 140, 0.2) 60%, rgba(80, 80, 100, 0.35) 100%);
  }
  body.wx-rain {
    --bg1: #92a8c0;
    --bg2: #5e7c98;
    --bg3: #3c5570;
    --glow-a: rgba(200, 220, 240, 0.3);
    --glow-b: rgba(40, 60, 90, 0.35);
    --sun-grad: radial-gradient(circle, rgba(200, 220, 240, 0.25) 0%, rgba(200,220,240,0) 70%);
    --horizon-grad: linear-gradient(180deg, transparent 0%, rgba(20, 40, 70, 0.3) 60%, rgba(10, 20, 40, 0.45) 100%);
    --ink: #f4f7fb;
    --ink-soft: #c8d4e2;
    --line: rgba(255, 255, 255, 0.18);
    --tile-bg: rgba(255, 255, 255, 0.18);
    --wish-bg: rgba(10, 20, 40, 0.65);
    --sunset-ink: #ffd9b3;
  }
  body.wx-sleet {
    --bg1: #c8d4e0;
    --bg2: #97acc6;
    --bg3: #6582a3;
    --glow-a: rgba(220, 230, 245, 0.5);
    --glow-b: rgba(80, 110, 150, 0.3);
    --sun-grad: radial-gradient(circle, rgba(230, 240, 255, 0.4) 0%, rgba(230,240,255,0) 70%);
    --horizon-grad: linear-gradient(180deg, transparent 0%, rgba(40, 70, 110, 0.2) 60%, rgba(20, 40, 70, 0.35) 100%);
    --ink: #16263e;
    --ink-soft: #3a4d68;
  }
  body.wx-snow {
    --bg1: #f3f6fa;
    --bg2: #dde6f0;
    --bg3: #b8c7d8;
    --glow-a: rgba(255, 255, 255, 0.7);
    --glow-b: rgba(160, 180, 210, 0.3);
    --sun-grad: radial-gradient(circle, rgba(255, 255, 255, 0.6) 0%, rgba(255,255,255,0) 70%);
    --horizon-grad: linear-gradient(180deg, transparent 0%, rgba(140, 160, 190, 0.2) 60%, rgba(100, 120, 150, 0.32) 100%);
    --ink: #1a2840;
    --ink-soft: #4a5d7a;
    --tile-bg: rgba(255, 255, 255, 0.75);
  }
  body.wx-thunder {
    --bg1: #3e2e5a;
    --bg2: #221838;
    --bg3: #100a1e;
    --glow-a: rgba(180, 140, 255, 0.32);
    --glow-b: rgba(255, 90, 60, 0.28);
    --sun-grad: radial-gradient(circle, rgba(255, 200, 120, 0.4) 0%, rgba(255, 200, 120, 0) 70%);
    --horizon-grad: linear-gradient(180deg, transparent 0%, rgba(255, 90, 60, 0.2) 60%, rgba(10, 5, 25, 0.55) 100%);
    --ink: #f5edff;
    --ink-soft: #c4b6dc;
    --paper: #f5edff;
    --line: rgba(255, 255, 255, 0.18);
    --tile-bg: rgba(255, 255, 255, 0.1);
    --wish-bg: rgba(255, 255, 255, 0.14);
    --sunset-ink: #ffd9a3;
  }

  /* Главный градиент температуры приходит из cardRenderer (шаг 2°C). */
  body { --temp-grad: {{TEMP_GRADIENT}}; }

  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body {
    width: var(--w);
    height: var(--h);
    font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display",
      "Inter", "Helvetica Neue", "Apple Color Emoji", "Segoe UI Emoji",
      sans-serif;
    color: var(--ink);
    -webkit-font-smoothing: antialiased;
    text-rendering: optimizeLegibility;
  }
  body {
    background:
      radial-gradient(circle at 78% 18%, var(--glow-a), transparent 55%),
      radial-gradient(circle at 12% 92%, var(--glow-b), transparent 55%),
      linear-gradient(180deg, var(--bg1) 0%, var(--bg2) 55%, var(--bg3) 100%);
    padding: 56px 72px 24px;
    display: flex;
    flex-direction: column;
    position: relative;
    overflow: hidden;
  }
  /* Декоративное солнце / диск */
  .sun {
    position: absolute;
    width: 360px; height: 360px;
    right: -90px; top: -90px;
    border-radius: 50%;
    background: var(--sun-grad);
    filter: blur(2px);
    z-index: 0;
  }
  .horizon {
    position: absolute;
    left: 0; right: 0; bottom: 0;
    height: 36%;
    background: var(--horizon-grad);
    z-index: 0;
  }

  /* === Header === */
  .head {
    display: flex;
    align-items: center;
    justify-content: space-between;
    z-index: 2;
  }
  .brand {
    display: flex;
    align-items: center;
    gap: 14px;
    font-size: 24px;
    font-weight: 600;
    letter-spacing: 4px;
    text-transform: uppercase;
    color: var(--ink-soft);
  }
  .brand .dot {
    width: 14px; height: 14px; border-radius: 50%;
    background: #ff6b3d;
  }

  /* === Hero === */
  .hero {
    z-index: 2;
    margin-top: 24px;
  }
  .city {
    font-size: 104px;
    font-weight: 800;
    line-height: 1;
    letter-spacing: -3px;
  }
  .when {
    margin-top: 14px;
    font-size: 36px;
    font-weight: 600;
    color: var(--ink-soft);
  }
  .when .sep {
    margin: 0 14px;
    opacity: 0.45;
  }

  /* === Temperature row === */
  .temp-row {
    z-index: 2;
    margin-top: auto;
    display: flex;
    align-items: flex-end;
    gap: 32px;
  }
  .temp {
    font-size: 300px;
    font-weight: 800;
    line-height: 0.86;
    letter-spacing: -12px;
    background: var(--temp-grad);
    -webkit-background-clip: text;
    background-clip: text;
    -webkit-text-fill-color: transparent;
  }
  .temp-meta {
    padding-bottom: 36px;
  }
  .emoji {
    font-size: 120px;
    line-height: 1;
    margin-bottom: 10px;
  }
  .label {
    font-size: 40px;
    font-weight: 600;
    color: var(--ink);
  }

  /* === Tiles === */
  .tiles {
    z-index: 2;
    margin-top: 32px;
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    gap: 24px;
  }
  .tile {
    background: var(--tile-bg);
    border: 1px solid var(--line);
    border-radius: 32px;
    padding: 30px 32px;
    backdrop-filter: blur(8px);
    display: flex;
    flex-direction: column;
    justify-content: space-between;
    min-height: 168px;
  }
  .tile .t-label {
    font-size: 22px;
    font-weight: 700;
    letter-spacing: 2.5px;
    text-transform: uppercase;
    color: var(--ink-soft);
  }
  .tile .t-value {
    font-size: 76px;
    font-weight: 800;
    line-height: 1;
    letter-spacing: -2px;
    color: var(--ink);
    display: flex;
    align-items: baseline;
    gap: 10px;
    white-space: nowrap;
  }
  .tile .t-suffix {
    font-size: 28px;
    font-weight: 600;
    color: var(--ink-soft);
    letter-spacing: 0;
  }
  .tile.sunset .t-value {
    font-size: 96px;
    color: var(--sunset-ink);
    letter-spacing: -3px;
  }

  /* === Wish === */
  .wish {
    z-index: 2;
    margin-top: 28px;
    padding: 28px 32px;
    background: var(--wish-bg);
    color: var(--wish-color);
    border-radius: 28px;
    display: flex;
    align-items: center;
    gap: 22px;
    backdrop-filter: blur(6px);
  }
  .wish .icon {
    font-size: 44px;
    line-height: 1;
    flex-shrink: 0;
  }
  .wish .text {
    font-size: 28px;
    font-weight: 500;
    line-height: 1.35;
    font-style: italic;
    letter-spacing: 0.1px;
  }
</style>
</head>
<body class="{{BODY_CLASS}}">
  <div class="sun"></div>
  <div class="horizon"></div>

  <div class="head">
    <div class="brand"><span class="dot"></span> {{WEEKDAY_UPPER}}</div>
  </div>

  <div class="hero">
    <div class="city">{{CITY}}</div>
    <div class="when">
      <span>{{DATE_LONG}}</span>
      <span class="sep">·</span>
      <span>закат сегодня в {{SUNSET}}</span>
    </div>
  </div>

  <div class="temp-row">
    <div class="temp">{{TEMP_SUNSET}}</div>
    <div class="temp-meta">
      <div class="emoji">{{EMOJI}}</div>
      <div class="label">{{WEATHER_LABEL}}</div>
    </div>
  </div>

  <div class="tiles">
    <div class="tile">
      <div class="t-label">Ощущается</div>
      <div class="t-value">{{FEELS_LIKE}}</div>
    </div>
    <div class="tile">
      <div class="t-label">Ветер</div>
      <div class="t-value">{{WIND}}<span class="t-suffix">м/с</span></div>
    </div>
    <div class="tile sunset">
      <div class="t-label">Закат</div>
      <div class="t-value">{{SUNSET}}</div>
    </div>
  </div>

  <div class="wish">
    <div class="icon">✦</div>
    <div class="text">{{WISH}}</div>
  </div>
</body>
</html>
